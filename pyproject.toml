[project]
name = "vinyl-wraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=0.29.0",
    "fastapi>=0.115.0",
    "google-generativeai>=0.8.0",
    "gradio-client>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0.80",
    "pillow>=10.2.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.7.2",
    "segment-anything",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.pyright]
include = ["backend", "check_cat.py", "test_api.py", "main.py"]
exclude = ["src", "node_modules", ".venv"]
extraPaths = ["."]

[tool.uv.sources]
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }
