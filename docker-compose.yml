services:
  fastapi-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vinyl_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage_data:/app/storage_data
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://vinyl_user:vinyl_pass@postgres:5432/vinyl_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - BASE_URL=http://localhost:8000
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: vinyl_postgres
    environment:
      POSTGRES_USER: vinyl_user
      POSTGRES_PASSWORD: vinyl_pass
      POSTGRES_DB: vinyl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vinyl_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: